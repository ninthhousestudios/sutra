# .sutra/rules.toml — Architectural constraints for sutra
#
# Severity levels:
#   blocking      — guard denies edits that introduce these
#   advisory      — warning in review, agent proceeds
#   informational — tracked in review output, silent otherwise
#
# Constraint identity = blake3(kind_tag, kind-specific params, scope).
# Name and provenance are human labels, not identity.


# ═══════════════════════════════════════════════════════════════════
# Guard isolation
# ═══════════════════════════════════════════════════════════════════
# The guard binary runs as a Claude Code PreToolUse hook on every edit.
# It must stay lightweight: read-only SQLite queries + rules TOML parsing.
# No FCA engine, no HRR vectors, no pipeline.

[[constraint]]
kind = "forbidden_dep"
from = "src/guard.rs"
to = "src/conventions/*"
name = "guard-no-conventions"
provenance = "docs/adr/0001-sketch-mode-conventions-only.md"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/guard.rs"
to = "src/similarity/*"
name = "guard-no-similarity"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/guard.rs"
to = "src/pipeline.rs"
name = "guard-no-pipeline"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/guard.rs"
to = "src/tools/*"
name = "guard-no-tools"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/bin/guard.rs"
to = "src/conventions/*"
name = "guard-bin-no-conventions"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/bin/guard.rs"
to = "src/similarity/*"
name = "guard-bin-no-similarity"
severity = "blocking"


# ═══════════════════════════════════════════════════════════════════
# DD worker purity
# ═══════════════════════════════════════════════════════════════════
# The timely/DD worker thread is pure computation over crossbeam channels.
# No database access, no tool handlers, no convention engine.
# ADR-0002: ephemeral data is recomputable; the worker needs no persistence.

[[constraint]]
kind = "forbidden_dep"
from = "src/constraints/worker.rs"
to = "src/db/*"
name = "worker-no-db"
provenance = "docs/adr/0002-ephemeral-durable-partition.md"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/constraints/worker.rs"
to = "src/tools/*"
name = "worker-no-tools"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/constraints/worker.rs"
to = "src/conventions/*"
name = "worker-no-conventions"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/constraints/worker.rs"
to = "src/similarity/*"
name = "worker-no-similarity"
severity = "blocking"


# ═══════════════════════════════════════════════════════════════════
# Layer boundaries — upward deps only
# ═══════════════════════════════════════════════════════════════════
# Data layer (db/) must not import presentation (tools/).
# Parser (L0) must not import tools.
# Constraint engine must not import convention engine and vice versa
# (they are independent L2/L3 systems joined only at the pipeline/tool level).

[[constraint]]
kind = "forbidden_dep"
from = "src/db/*"
to = "src/tools/*"
name = "db-no-tools"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/parser/*"
to = "src/tools/*"
name = "parser-no-tools"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/constraints/engine.rs"
to = "src/conventions/*"
name = "dd-engine-no-conventions"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/conventions/*"
to = "src/constraints/*"
name = "conventions-no-constraints"
severity = "blocking"


# ═══════════════════════════════════════════════════════════════════
# Tool handler independence
# ═══════════════════════════════════════════════════════════════════
# Tool handlers are self-contained MCP endpoints. They depend on library
# code but not on each other. No cycles allowed within src/tools/.

[[constraint]]
kind = "no_cycles"
scope = "src/tools/"
name = "no-tool-cycles"
severity = "blocking"


# ═══════════════════════════════════════════════════════════════════
# Known cross-layer coupling (advisory)
# ═══════════════════════════════════════════════════════════════════
# These document existing architectural debt. Not blocking because they
# exist for pragmatic reasons, but agents should not deepen them.

# parser::adapter imports conventions::SymbolAttrs for the FcaAttributeSource
# extension trait (ADR-0003). This is the designed coupling — one-directional,
# no back-edge. Waived rather than enforced.
# [[constraint]]
# kind = "forbidden_dep"
# from = "src/parser/*"
# to = "src/conventions/*"
# name = "parser-conventions-coupling"
# provenance = "docs/adr/0003-layered-adapter-traits.md"
# severity = "advisory"

# similarity::mod imports parser::adapter::default_registry.
# Math/embedding layer should not depend on parser infrastructure.
[[constraint]]
kind = "forbidden_dep"
from = "src/similarity/*"
to = "src/parser/*"
name = "similarity-parser-coupling"
severity = "advisory"


# ═══════════════════════════════════════════════════════════════════
# Cycle prevention
# ═══════════════════════════════════════════════════════════════════
# No import cycles within the constraint subsystem.
# The core module layout should stay acyclic.

[[constraint]]
kind = "no_cycles"
scope = "src/constraints/"
name = "no-constraint-cycles"
severity = "blocking"

[[constraint]]
kind = "no_cycles"
scope = "src/conventions/"
name = "no-convention-cycles"
severity = "blocking"


# ═══════════════════════════════════════════════════════════════════
# Fan-in limits
# ═══════════════════════════════════════════════════════════════════
# Infrastructure types (error.rs, freshness.rs) naturally have high fan-in.
# These limits flag domain modules that are becoming god objects.

# rules.rs is a pure types/schema module (Severity, Constraint, Rules, etc.)
# with zero outgoing deps beyond error.rs — high fan-in is expected.
# [[constraint]]
# kind = "max_fan_in"
# target = "src/rules.rs"
# threshold = 15
# name = "rules-fan-in"
# severity = "advisory"

[[constraint]]
kind = "max_fan_in"
target = "src/pipeline.rs"
threshold = 20
name = "pipeline-fan-in"
severity = "advisory"

[[constraint]]
kind = "max_fan_in"
target = "src/components/mod.rs"
threshold = 15
name = "components-fan-in"
severity = "advisory"


# ═══════════════════════════════════════════════════════════════════
# Lessons isolation (checkpoint:sutra/152, 2026-06-16)
# ═══════════════════════════════════════════════════════════════════
# LessonsDb owns its own SQLite file, independent of per-workspace DBs.
# It must not couple to workspace DB internals, and heavyweight subsystems
# (guard, DD worker) must not depend on it.

[[constraint]]
kind = "forbidden_dep"
from = "src/lessons.rs"
to = "src/db/*"
name = "lessons-no-db"
provenance = "checkpoint:sutra/152"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/guard.rs"
to = "src/lessons.rs"
name = "guard-no-lessons"
provenance = "checkpoint:sutra/152"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/constraints/worker.rs"
to = "src/lessons.rs"
name = "worker-no-lessons"
provenance = "checkpoint:sutra/152"
severity = "blocking"


# ═══════════════════════════════════════════════════════════════════
# Explore tool isolation (checkpoint:sutra/171, 2026-06-16)
# ═══════════════════════════════════════════════════════════════════
# sutra_explore is a deterministic, index-only pipeline: grep → rank → assemble.
# It must not grow to import heavyweight analysis engines. The PRD explicitly
# rejects vector search, embeddings, and NL interpretation.

[[constraint]]
kind = "forbidden_dep"
from = "src/tools/explore.rs"
to = "src/similarity/*"
name = "explore-no-similarity"
provenance = "checkpoint:sutra/171"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/tools/explore.rs"
to = "src/conventions/*"
name = "explore-no-conventions"
provenance = "checkpoint:sutra/171"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/tools/explore.rs"
to = "src/lessons.rs"
name = "explore-no-lessons"
provenance = "checkpoint:sutra/175"
severity = "blocking"


# ═══════════════════════════════════════════════════════════════════
# Lessons engine isolation (checkpoint:sutra/157, 2026-06-16)
# ═══════════════════════════════════════════════════════════════════
# Lessons engine is a library consumed by tool handlers. It must not
# couple back to tools, conventions (FCA), or constraints (DD).

[[constraint]]
kind = "forbidden_dep"
from = "src/lessons.rs"
to = "src/tools/*"
name = "lessons-no-tools"
provenance = "checkpoint:sutra/157"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/lessons.rs"
to = "src/conventions/*"
name = "lessons-no-conventions"
provenance = "checkpoint:sutra/157"
severity = "blocking"

[[constraint]]
kind = "forbidden_dep"
from = "src/lessons.rs"
to = "src/constraints/*"
name = "lessons-no-constraints"
provenance = "checkpoint:sutra/157"
severity = "blocking"


# ═══════════════════════════════════════════════════════════════════
# Convention management
# ═══════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════
# AST-pattern constraints
# ═══════════════════════════════════════════════════════════════════
# Structural code patterns enforced via tree-sitter queries.
# Default severity: advisory (heuristic — can't see intent).

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '(call_expression function: (field_expression field: (field_identifier) @m (#eq? @m "clone"))) @match'
name = "no-clone-driven-dev"
provenance = "CLAUDE.md coding_discipline"
severity = "blocking"
scope = "src/"


# ═══════════════════════════════════════════════════════════════════
# Swallowed-error ratchet (sutra/486)
# ═══════════════════════════════════════════════════════════════════
# From vidhi/language-rules (back-test: sutra docs/swallow-ratchet-backtest.md).
# Tier A (blocking): the guard denies an introduced match unless the line, or
# the comment lines directly above it, say `// swallow: <reason>`. sutra_review
# lists every justification a diff adds. Tier B (advisory): reported by review
# and `sutra check` on added lines only; never blocks.

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '''
(call_expression function: (field_expression field: (field_identifier) @match (#eq? @match "ok")) arguments: (arguments) @a (#eq? @a "()"))
'''
name = "rs-ok"
severity = "blocking"
scope = "src/"
justify = "swallow:"
provenance = "vidhi language-rules (sutra/486)"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '''
(let_declaration pattern: "_" @match value: [(call_expression) (await_expression) (try_expression)])
'''
name = "rs-let-underscore"
severity = "blocking"
scope = "src/"
justify = "swallow:"
provenance = "vidhi language-rules (sutra/486)"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '''
((identifier) @match (#match? @match "^_(e|err|errs|error|errors)$"))
'''
name = "rs-underscore-err-binding"
severity = "blocking"
scope = "src/"
justify = "swallow:"
provenance = "vidhi language-rules (sutra/486)"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '''
(if_expression condition: (let_condition pattern: (tuple_struct_pattern type: (identifier) @match (#eq? @match "Ok"))) !alternative)
'''
name = "rs-if-let-ok-no-else"
severity = "blocking"
scope = "src/"
justify = "swallow:"
provenance = "vidhi language-rules (sutra/486)"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '''
(let_declaration pattern: (tuple_struct_pattern type: (identifier) @match (#eq? @match "Ok")) alternative: (block))
'''
name = "rs-let-ok-else"
severity = "blocking"
scope = "src/"
justify = "swallow:"
provenance = "vidhi language-rules (sutra/486)"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '''
(tuple_struct_pattern type: (identifier) @match (#eq? @match "Err") . "_" .)
(tuple_struct_pattern type: (identifier) @match (#eq? @match "Err") . (identifier) @i (#match? @i "^_") .)
'''
name = "rs-err-discard-arm"
severity = "blocking"
scope = "src/"
justify = "swallow:"
provenance = "vidhi language-rules (sutra/486)"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '''
(call_expression function: (field_expression field: (field_identifier) @match (#match? @match "^(unwrap_or_else|or_else|map_or_else)$")) arguments: (arguments . (closure_expression parameters: (closure_parameters) @p (#match? @p "^\\|\\s*_\\w*\\s*\\|$"))))
'''
name = "rs-closure-discards-err"
severity = "blocking"
scope = "src/"
justify = "swallow:"
provenance = "vidhi language-rules (sutra/486)"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '''
(call_expression function: (field_expression value: (call_expression function: (field_expression field: (field_identifier) @r (#not-match? @r "^(get|get_mut|cloned|copied|max|min|max_by_key|min_by_key|max_by|min_by|first|last|nth|find|next|next_back|pop|peek|position|to_str|file_name|file_stem|extension|parent|as_deref|as_ref|checked_sub|checked_add|checked_div|checked_mul)$"))) field: (field_identifier) @match (#eq? @match "unwrap_or_default")))
(call_expression function: (field_expression value: (call_expression function: [(identifier) (scoped_identifier)]) field: (field_identifier) @match (#eq? @match "unwrap_or_default")))
'''
name = "rs-unwrap-or-default"
severity = "advisory"
scope = "src/"
provenance = "vidhi language-rules (sutra/486)"

[[constraint]]
kind = "forbidden_pattern"
language = "rust"
query = '''
(call_expression function: (field_expression value: (call_expression function: (field_expression field: (field_identifier) @r (#not-match? @r "^(get|get_mut|cloned|copied|max|min|max_by_key|min_by_key|max_by|min_by|first|last|nth|find|next|next_back|pop|peek|position|to_str|file_name|file_stem|extension|parent|as_deref|as_ref|checked_sub|checked_add|checked_div|checked_mul)$"))) field: (field_identifier) @match (#eq? @match "unwrap_or")) arguments: (arguments . [(boolean_literal) (integer_literal) (float_literal) (string_literal) (scoped_identifier) (unary_expression)] .))
(call_expression function: (field_expression value: (call_expression function: [(identifier) (scoped_identifier)]) field: (field_identifier) @match (#eq? @match "unwrap_or")) arguments: (arguments . [(boolean_literal) (integer_literal) (float_literal) (string_literal) (scoped_identifier) (unary_expression)] .))
'''
name = "rs-unwrap-or-lit"
severity = "advisory"
scope = "src/"
provenance = "vidhi language-rules (sutra/486)"
